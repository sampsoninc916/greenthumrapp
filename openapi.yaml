openapi: 3.0.3
info:
  title: Thumr Marketplace API
  version: 1.0.0
  description: |
    OpenAPI definition for the Thumr plant marketplace backend. The specification is structured
    so it can be imported directly into Amazon API Gateway. Each operation is secured with a Cognito
    user pool authorizer unless otherwise noted and integrates with a dedicated Lambda function via
    the `x-amazon-apigateway-integration` vendor extension.
servers:
  - url: https://{apiId}.execute-api.{region}.amazonaws.com/{stage}
    description: API Gateway invoke URL
    variables:
      apiId:
        default: yourApiId
        description: Replace with the REST API identifier assigned by API Gateway.
      region:
        default: us-east-1
        description: AWS region that hosts the API Gateway deployment.
      stage:
        default: prod
        description: API Gateway stage name.
security:
  - cognitoAuthorizer: []
tags:
  - name: Plants
    description: Plant marketplace listings and management.
  - name: Uploads
    description: Asset uploads and media hygiene.
  - name: Users
    description: Authenticated user profile management.
  - name: Messages
    description: Buyer and seller messaging workflows.
  - name: Reviews
    description: Buyer review submission and seller rating summaries.
  - name: Admin
    description: Administrative review, moderation, and auditing operations.
  - name: Email
    description: Marketing and lifecycle email orchestration.
  - name: Payments
    description: Checkout and payment processing.
x-amazon-apigateway-importexport-version: '1.0'
x-amazon-apigateway-cors:
  allowOrigins:
    - '*'
  allowMethods:
    - GET
    - POST
    - PUT
    - OPTIONS
  allowHeaders:
    - Authorization
    - Content-Type
    - X-Amz-Date
    - X-Amz-Security-Token
    - X-Requested-With
paths:
  /plants:
    get:
      tags:
        - Plants
      summary: List plant listings
      operationId: listPlants
      description: Retrieve paginated plant listings with optional cursor-based pagination.
      parameters:
        - name: page
          in: query
          description: Page number to fetch when using page-based pagination.
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          description: Maximum number of items to return when paging by page number.
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          description: Continuation token returned by a previous response for cursor-based pagination.
          schema:
            type: string
        - name: category
          in: query
          description: Filter listings by category slug.
          schema:
            type: string
        - name: search
          in: query
          description: Free text search applied to listing titles and descriptions.
          schema:
            type: string
        - name: deliveryMethod
          in: query
          description: Restrict results to listings that support the specified fulfillment method.
          schema:
            type: string
            enum:
              - LOCAL_PICKUP
              - LOCAL_DELIVERY
              - REGIONAL_SHIPPING
              - NATIONWIDE_SHIPPING
      responses:
        '200':
          description: Paginated plant listings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security: []
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${stageVariables.listPlantsFunctionArn}/invocations
    post:
      tags:
        - Plants
      summary: Create a plant listing
      operationId: createPlant
      description: Create a new plant listing for the authenticated seller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlantRequest'
      responses:
        '201':
          description: Plant listing created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantResponseEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${stageVariables.createPlantFunctionArn}/invocations
    put:
      tags:
        - Plants
      summary: Update a plant listing
      operationId: updatePlant
      description: Update mutable fields on an existing plant listing. Only provided fields are modified.
      parameters:
        - name: plantId
          in: query
          required: true
          description: Identifier of the plant listing to update.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlantRequest'
      responses:
        '200':
          description: Plant listing updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantResponseEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${stageVariables.updatePlantFunctionArn}/invocations
  /uploads/presign:
    post:
      tags:
        - Uploads
      summary: Create presigned upload targets
      operationId: createPresignedUploads
      description: Generate presigned S3 upload URLs for the provided media files.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignUploadsRequest'
      responses:
        '200':
          description: Presigned upload targets returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignUploadsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${stageVariables.createUploadIntentFunctionArn}/invocations
  /uploads/scan:
    post:
      tags:
        - Uploads
      summary: Scan uploaded media
      operationId: scanUploads
      description: Perform antivirus and policy checks against uploaded media files prior to publishing a listing.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
              required:
                - files
      responses:
        '200':
          description: Scan verdict for each uploaded file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadScanResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${stageVariables.scanUploadFunctionArn}/invocations
  /uploads/cleanup:
    post:
      tags:
        - Uploads
      summary: Remove orphaned uploads
      operationId: cleanupUploads
      description: Delete uploaded objects that were not attached to a completed plant listing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadCleanupRequest'
      responses:
        '202':
          description: Cleanup task accepted.
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${stageVariables.cleanupUploadsFunctionArn}/invocations
  /users:
    post:
      tags:
        - Users
      summary: Create user profile
      operationId: createUserProfile
      description: Create or initialize a profile for the authenticated Cognito user after signup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: User profile created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${stageVariables.createUserFunctionArn}/invocations
  /users/me:
    get:
      tags:
        - Users
      summary: Get current user profile
      operationId: getCurrentUserProfile
      description: Retrieve the profile details for the authenticated user.
      responses:
        '200':
          description: Authenticated user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${stageVariables.getCurrentUserFunctionArn}/invocations
    put:
      tags:
        - Users
      summary: Update current user profile
      operationId: updateCurrentUserProfile
      description: Update profile details or communication preferences for the authenticated user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Updated user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${stageVariables.updateCurrentUserFunctionArn}/invocations
  /messages/threads:
    post:
      tags:
        - Messages
      summary: Start a conversation thread
      operationId: createMessageThread
      description: Begin a new buyer-seller conversation tied to a specific plant listing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartThreadRequest'
      responses:
        '201':
          description: Conversation thread created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageThread'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${stageVariables.createThreadFunctionArn}/invocations
  /messages/send:
    post:
      tags:
        - Messages
      summary: Send a message
      operationId: sendMessage
      description: Send a message within an existing buyer-seller thread.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: Message accepted and queued for delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadMessage'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${stageVariables.sendMessageFunctionArn}/invocations
  /messages/read:
    post:
      tags:
        - Messages
      summary: Mark messages as read
      operationId: markMessagesRead
      description: Mark a thread or individual messages as read by the authenticated user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkThreadReadRequest'
      responses:
        '204':
          description: Read state updated.
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${stageVariables.markThreadReadFunctionArn}/invocations
  /messages/unread-count:
    get:
      tags:
        - Messages
      summary: Get unread message count
      operationId: getUnreadMessageCount
      description: Retrieve unread message totals for the authenticated user.
      responses:
        '200':
          description: Unread message counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCountResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${stageVariables.getUnreadCountFunctionArn}/invocations
  /reviews:
    post:
      tags:
        - Reviews
      summary: Submit a review
      operationId: submitReview
      description: Submit a review for a completed purchase.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitReviewRequest'
      responses:
        '201':
          description: Review recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitReviewResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${stageVariables.submitReviewFunctionArn}/invocations
  /reviews/summary:
    get:
      tags:
        - Reviews
      summary: Get review summary
      operationId: getReviewSummary
      description: Retrieve aggregate review metrics for the seller of a plant listing.
      parameters:
        - name: plantId
          in: query
          required: true
          description: Identifier of the plant listing whose seller metrics should be returned.
          schema:
            type: string
      responses:
        '200':
          description: Aggregated seller review metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewSummary'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${stageVariables.getReviewSummaryFunctionArn}/invocations
  /admin/users:
    get:
      tags:
        - Admin
      summary: List users for moderation
      operationId: adminListUsers
      description: Retrieve users that require moderation or review.
      parameters:
        - name: status
          in: query
          description: Filter results by user account status.
          schema:
            type: string
            enum:
              - active
              - pending
              - suspended
              - under_review
        - name: role
          in: query
          description: Filter results by role.
          schema:
            type: string
            enum:
              - buyer
              - seller
              - admin
        - name: q
          in: query
          description: Free text search across name and email.
          schema:
            type: string
      responses:
        '200':
          description: Moderation list of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${stageVariables.adminListUsersFunctionArn}/invocations
  /admin/users/{userId}/status:
    put:
      tags:
        - Admin
      summary: Update user status
      operationId: adminUpdateUserStatus
      description: Modify the moderation status for a user account.
      parameters:
        - name: userId
          in: path
          required: true
          description: Identifier of the user to update.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdminUserStatusRequest'
      responses:
        '200':
          description: Updated user record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${stageVariables.adminUpdateUserStatusFunctionArn}/invocations
  /admin/listings:
    get:
      tags:
        - Admin
      summary: List listings for review
      operationId: adminListListings
      description: Retrieve listings that are pending moderation or have been flagged.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - pending
              - approved
              - rejected
              - taken_down
        - name: flagged
          in: query
          description: Filter for listings that have outstanding flags.
          schema:
            type: boolean
        - name: q
          in: query
          description: Free text search criteria.
          schema:
            type: string
      responses:
        '200':
          description: Moderation list of listings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListingListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${stageVariables.adminListListingsFunctionArn}/invocations
  /admin/listings/{listingId}/approve:
    post:
      tags:
        - Admin
      summary: Approve listing
      operationId: adminApproveListing
      description: Approve a listing that has passed moderation review.
      parameters:
        - name: listingId
          in: path
          required: true
          description: Listing identifier to approve.
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveListingRequest'
      responses:
        '200':
          description: Updated listing record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListing'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${stageVariables.adminApproveListingFunctionArn}/invocations
  /admin/listings/{listingId}/takedown:
    post:
      tags:
        - Admin
      summary: Take down listing
      operationId: adminTakeDownListing
      description: Remove a listing that violates marketplace policies.
      parameters:
        - name: listingId
          in: path
          required: true
          description: Listing identifier to take down.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TakeDownListingRequest'
      responses:
        '200':
          description: Updated listing record with the take-down status applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListing'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${stageVariables.adminTakeDownListingFunctionArn}/invocations
  /admin/disputes:
    get:
      tags:
        - Admin
      summary: List disputes
      operationId: adminListDisputes
      description: Retrieve buyer-seller disputes that require attention.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - open
              - investigating
              - resolved
              - escalated
        - name: severity
          in: query
          schema:
            type: string
            enum:
              - low
              - medium
              - high
              - critical
        - name: q
          in: query
          description: Search term to filter disputes.
          schema:
            type: string
      responses:
        '200':
          description: List of disputes for moderation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDisputeListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${stageVariables.adminListDisputesFunctionArn}/invocations
  /admin/disputes/{disputeId}/resolve:
    post:
      tags:
        - Admin
      summary: Resolve dispute
      operationId: adminResolveDispute
      description: Mark a dispute as resolved and document the resolution notes.
      parameters:
        - name: disputeId
          in: path
          required: true
          description: Identifier of the dispute to resolve.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveDisputeRequest'
      responses:
        '200':
          description: Updated dispute record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDispute'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${stageVariables.adminResolveDisputeFunctionArn}/invocations
  /admin/disputes/{disputeId}/escalate:
    post:
      tags:
        - Admin
      summary: Escalate dispute
      operationId: adminEscalateDispute
      description: Escalate a dispute for additional investigation.
      parameters:
        - name: disputeId
          in: path
          required: true
          description: Identifier of the dispute to escalate.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalateDisputeRequest'
      responses:
        '200':
          description: Updated dispute record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDispute'
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${stageVariables.adminEscalateDisputeFunctionArn}/invocations
  /admin/audit:
    post:
      tags:
        - Admin
      summary: Record audit event
      operationId: adminCreateAuditEvent
      description: Persist an administrative audit event describing moderation or support actions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAuditEvent'
      responses:
        '202':
          description: Audit event accepted for processing.
        default:
          $ref: '#/components/responses/ErrorResponse'
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${stageVariables.adminCreateAuditEventFunctionArn}/invocations
  /email/subscribe:
    post:
      tags:
        - Email
      summary: Subscribe contact to marketing list
      operationId: emailSubscribe
      description: Register a contact for marketing communications and persist consent metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailSubscribeRequest'
      responses:
        '200':
          description: Subscription status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailSubscribeResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security: []
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${stageVariables.emailSubscribeFunctionArn}/invocations
  /email/unsubscribe:
    post:
      tags:
        - Email
      summary: Unsubscribe contact
      operationId: emailUnsubscribe
      description: Remove a contact from marketing communications and update consent records.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailUnsubscribeRequest'
      responses:
        '200':
          description: Unsubscription status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailUnsubscribeResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security: []
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${stageVariables.emailUnsubscribeFunctionArn}/invocations
  /email/lifecycle:
    post:
      tags:
        - Email
      summary: Trigger lifecycle email
      operationId: emailTriggerLifecycle
      description: Queue a lifecycle email using a pre-defined template and dynamic payload data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailLifecycleRequest'
      responses:
        '202':
          description: Lifecycle email scheduled for delivery.
        default:
          $ref: '#/components/responses/ErrorResponse'
      security: []
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${stageVariables.emailLifecycleFunctionArn}/invocations
  /email/templates-sync:
    post:
      tags:
        - Email
      summary: Synchronize lifecycle templates
      operationId: emailTemplatesSync
      description: Upsert lifecycle email templates on the server prior to sending events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTemplatesSyncRequest'
      responses:
        '200':
          description: Templates synchronized.
        default:
          $ref: '#/components/responses/ErrorResponse'
      security: []
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${stageVariables.emailTemplatesSyncFunctionArn}/invocations
  /email/consent:
    post:
      tags:
        - Email
      summary: Record consent preferences
      operationId: emailRecordConsent
      description: Persist marketing consent updates from external forms.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailConsentRecord'
      responses:
        '200':
          description: Consent recorded.
        default:
          $ref: '#/components/responses/ErrorResponse'
      security: []
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${stageVariables.emailConsentFunctionArn}/invocations
  /payments/charge:
    post:
      tags:
        - Payments
      summary: Process payment charge
      operationId: createPaymentCharge
      description: Create a charge for a checkout transaction using the configured payment processor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentChargeRequest'
      responses:
        '200':
          description: Charge result from the payment processor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentChargeResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security: []
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/${stageVariables.paymentsChargeFunctionArn}/invocations
components:
